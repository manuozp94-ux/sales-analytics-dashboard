name: Bug Report
description: Report a defect in data logic, pipeline behavior, docs, or workflow automation.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear and concise bug summary.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Ordered steps with file paths and commands when possible.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste error output, screenshots, query results, or logs.

  - type: input
    id: scope
    attributes:
      label: Impacted Area
      description: Example: SQL model, notebook, docs, CI, Fabric sync.
